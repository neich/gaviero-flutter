name: gaviero_remote
description: "Gaviero Remote — mobile mirror of the gaviero agent chat panel."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  # Pins verified on pub.dev 2026-08-01 (PLAN.md §2). Do not swap for
  # flutter_markdown / qr_code_scanner / flutter_highlight — see PLAN.md §2.1.
  web_socket_channel: ^3.0.3
  gpt_markdown: ^1.2.1
  flutter_secure_storage: ^11.1.1
  mobile_scanner: ^7.4.1
  flutter_local_notifications: ^22.3.0
  # ntfy click → open the paired instance (remote-ntfy v1).
  # v7 matches Flutter 3.47 / Dart 3.13 and AGP 9.
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Already pinned transitively by flutter_test; declared for direct use in
  # the connection lifecycle tests.
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
